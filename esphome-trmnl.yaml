substitutions:
  fw_version: "1.1.2 esphome-trmnl"
  server_url: "http://192.168.1.100:80" # url inker
  mqtt_broker_ip: "192.168.1.100" # ip Mosquitto broker 
  manual_ip_static_ip: "192.168.1.222" # Статический IP-адрес дисплея
  manual_ip_gateway: "192.168.1.1" # Шлюз локальной сети
  manual_ip_subnet: "255.255.255.0" # Подсеть локальной сети

  name: "trmnl" # Это имя дисплея. Может содержать только строчные буквы, цифры и дефисы и по умолчанию может иметь длину не более 24
  friendly_name: "TRMNL" # Это имя отображается в интерфейсе и используется Home Assistant в качестве имени интеграции и устройства.
  model: 7.50in-bV3 # Модель дисплея
  wifi_output_power: 8.5dB # Величина мощности передачи для интерфейса Wi-Fi от 8,5 dB до 20,5 dB

  img_type: BINARY # Указывает способ внутреннего кодирования изображения.
  img_format: PNG # формат, в котором закодировано изображение.
  img_url_setup_logo: http://raw.githubusercontent.com/kfattum/esphome-trmnl/refs/heads/main/img/setup-logo.bmp # изображение заглушка

  deep_sleep_delay: 1000ms # Задержка перед сном для обновления экрана 
  sleep_time: "3600" # (сек.) Время сна экрана по умолчанию 
  error_sleep_duration: "1200" # (сек.) Время сна экрана при возникновении ошибки
  reset_duration: 200 ms # Длительность операции сброса дисплея
  wifi_connect_delay: 15s # Время на попытку подключения к wifi
  mqtt_connect_delay: 500ms # Задержка после подключения к MQTT

  # status_led: GPIO2
  button: GPIO32
  adc_pin: GPIO34
  deep_sleep_pin: GPIO32

  clk_pin: GPIO13
  mosi_pin: GPIO14

  cs_pin: GPIO15
  dc_pin: GPIO27
  busy_pin: GPIO25 #Для предотвращения необратимого повреждения дисплея необходимо инвертировать контакт BUSY на моделях gdew0154m09, Waveshare 7.30in-f и Waveshare 7.50in V2 (и наверно на V3 и других новых моделях). Установите для контакта busy значение inverted: true в настройках
  reset_pin: GPIO26   


globals:
  - id: device_id
    type: std::string
    max_restore_data_length: 13
    restore_value: true
    initial_value: '""'
  - id: api_key
    type: std::string
    max_restore_data_length: 43
    restore_value: true
    initial_value: '""'
  - id: sleep_time
    type: uint32_t
    restore_value: true
    initial_value: "$sleep_time"
  - id: current_page_id
    type: uint8_t
    restore_value: true
    initial_value: "0" # 0: нет данных, 1: trmnl_page, 2: failed, 3: pause_page
  - id: ota_mod
    type: bool
    initial_value: "false"

esp32:
  variant: ESP32
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
  cpu_frequency: 160MHz

esphome:
  min_version: 2026.1.3 #https://github.com/esphome/esphome/pull/13599
  name: $name
  friendly_name: $friendly_name
  on_boot:
    priority: -10
    then:
      # Проверяем, зажата ли кнопка при включении (пин GPIO32)
      - if:
          condition:
            lambda: 'return id(back_button).state;' 
          then:
            - logger.log: "Кнопка зажата при старте! Вход в режим OTA."
            - lambda: 'id(ota_mod) = true;'
            - script.execute:
                id: safe_update_display
                target_page: 4 # Страница OTA MODE
                force_update: false
          else:
            # Обычный запуск
            - delay: $wifi_connect_delay
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - script.execute: trmnl_error

  project:
    name: "kfattum.esphome-trmnl"
    version: "$fw_version"

# To be able to get logs from the device via serial and api.
# debug:
#   update_interval: 5s

logger:
  # level: VERBOSE
  on_message:
    level: ERROR
    then:
      - script.execute: trmnl_error

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: $mqtt_broker_ip
  username: $name
  password: !secret mqtt_password
  on_connect:
    - delay: $mqtt_connect_delay
    - if:
        # Проверяем: если OTA режим НЕ активен (false), тогда идем дальше
        condition:
          lambda: 'return !id(ota_mod);'
        then:
          - if:
              condition:
                lambda: |-
                  return id(device_id).empty() || id(api_key).empty();
              then:
                - script.execute: trmnl_setup
              else:
                - script.execute: trmnl_update
        else:
          - logger.log: "MQTT подключен, но выполнение скриптов заблокировано (активен OTA MODE)"

mdns:
  disabled: true

improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: LIGHT
  fast_connect: true # -5 сек
  output_power: $wifi_output_power
  manual_ip: 
    static_ip: $manual_ip_static_ip  # -3 сек 
    gateway: $manual_ip_gateway
    subnet: $manual_ip_subnet

http_request:
  buffer_size_tx: 2048
  verify_ssl: False
  timeout: 10s
  watchdog_timeout: 15s

deep_sleep:
  wakeup_pin:
    number: $deep_sleep_pin
    allow_other_uses: true  
    inverted: true 
  run_duration: 30 min
  sleep_duration: $error_sleep_duration s

online_image:
  - id: trmnl_image
    format: $img_format
    type: $img_type
    buffer_size: 20000
    url: $img_url_setup_logo
    resize: 800x480
    on_download_finished:
      - delay: 16ms
      - script.execute:
          id: safe_update_display
          target_page: 1
          force_update: true 
    on_error:
        - script.execute: trmnl_error

script:

# /api/setup
# {
#     "api_key": "...",
#     "friendly_id": "...",
#     "image_url": "https://usetrmnl.com/images/setup/setup-logo.bmp",
#     "message": "Register at usetrmnl.com/signup with Device ID '...'",
#     "status": 200
# }

  - id: trmnl_setup
    then:
      - logger.log: "Setting up TRMNL"
      - http_request.get:
          url: ${server_url}/api/setup/
          request_headers:
            ID: !lambda 'return id(mac_address_sensor).state.c_str();'
          capture_response: true
          on_response:
            - if:
                condition:
                  lambda: return response->status_code >= 200 && response->status_code < 300;
                then:
                  - logger.log:
                      format: "TRMNL Setup Response: %s"
                      args: [body.c_str()]
                  - lambda: |-
                      json::parse_json(body, [](JsonObject root) -> bool {
                        if (root["api_key"].is<std::string>()) {
                          id(api_key) = root["api_key"].as<std::string>();
                          id(device_id) = root["friendly_id"].as<std::string>();
                          global_preferences->sync();
                        }
                        return true;
                      });
                  - delay: 16ms
                  - script.execute: trmnl_update
                else:
                  - logger.log:
                      format: "TRMNL Setup Failed. HTTP Status: %d"
                      args: [response->status_code]
                  - script.execute: trmnl_error
          on_error:
            - logger.log: "TRMNL Setup Connection Error / Timeout"
            - script.execute: trmnl_error

# curl http://192.168.1.123:80/api/display --header "access-token:xxxxxxxxxxxxxxxxxxxxxx"
# Invoke-WebRequest -Uri "http://192.168.1.123:80/api/display" -Headers @{"access-token"="xxxxxxxxxxxxxxxxxxxxxx"}

# /api/display
# {
#     "filename": "....bmp",
#     "firmware_url": "https://trmnl.s3.us-east-2.amazonaws.com/FW1.4.5.bin",
#     "image_url": "https://trmnl.s3.us-east-2.amazonaws.com/...",
#     "refresh_rate": 903,
#     "reset_firmware": false,
#     "special_function": "identify",
#     "status": 0,
#     "update_firmware": null
# }

  - id: trmnl_update
    then:
      - if:
          condition:
            switch.is_on: block_update_switch
          then:
            - logger.log: "Обновление дисплея заблокировано переключателем"
            - script.execute:
                id: safe_update_display
                target_page: 3 # ID страницы pause_page
                force_update: false
            - delay: $deep_sleep_delay
            - deep_sleep.enter:
                sleep_duration: !lambda 'return id(sleep_time) * 1000;'
          else:
            - logger.log: "Updating TRMNL image"
            - http_request.get:
                url: ${server_url}/api/display/
                request_headers:
                  ID: !lambda 'return id(mac_address_sensor).state.c_str();'
                  Access-Token: !lambda 'return id(api_key).c_str();'
                  Battery-Voltage: !lambda 'return id(battery_voltage_text).state.c_str();'
                  Refresh-Rate: !lambda 'return std::to_string(id(sleep_time)).c_str();'
                  FW-Version: !lambda 'return "$fw_version";'
                  RSSI: !lambda 'return id(rssi_text).state.c_str();'
                  Screen-Design-ID-Override: !lambda 'return id(screen_design_id_override).state.c_str();'
                capture_response: true
                on_response:
                  - if:
                      condition:
                        lambda: return response->status_code >= 200 && response->status_code < 300;
                      then:
                        - logger.log:
                            format: "TRMNL Update Response: %s"
                            args: [body.c_str()]
                        - lambda: |-
                            json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["status"].is<int>() && root["status"].as<int>() == 0) {
                                id(trmnl_image).set_url(root["image_url"].as<std::string>());
                                id(sleep_time) = root["refresh_rate"].as<uint32_t>();
                              }
                              return true;
                            });
                        - delay: 16ms
                        - component.update: trmnl_image
                      else:
                        - logger.log:
                            format: "TRMNL Update Failed. HTTP Status: %d"
                            args: [response->status_code]
                        - script.execute: trmnl_error
                on_error:
                  - logger.log: "TRMNL Update Connection Error / Timeout"
                  - script.execute: trmnl_error

  - id: trmnl_error
    then:
      - if:
          condition:
            lambda: 'return !id(ota_mod);'
          then:
            - script.execute:
                id: safe_update_display
                target_page: 2
                force_update: false
            - delay: $deep_sleep_delay
            - deep_sleep.enter:
                sleep_duration: $error_sleep_duration s
          else:
            - logger.log: "Ошибка произошла в OTA режиме, сон отменен."

  - id: safe_update_display
    parameters:
      target_page: uint8_t
      force_update: bool
    then:
      - if:
          condition:
            or:
              - lambda: 'return id(current_page_id) != target_page;'
              - lambda: 'return force_update;'
          then:
            - delay: 16ms
            - lambda: |-
                id(current_page_id) = target_page; // Запоминаем/подтверждаем новую страницу
                if (target_page == 1) {
                  id(trmnl_display).show_page(id(trmnl_page));
                  ESP_LOGD("display", "Обновление экрана: trmnl_page");
                } else if (target_page == 2) {
                  id(trmnl_display).show_page(id(failed));
                  ESP_LOGD("display", "Обновление экрана: failed");
                } else if (target_page == 3) {
                  id(trmnl_display).show_page(id(pause_page));
                  ESP_LOGD("display", "Обновление экрана: pause_page");
                } else if (target_page == 4) { 
                  id(trmnl_display).show_page(id(ota_page)); 
                  ESP_LOGD("display", "Обновление экрана: ota_page");
                }
            - delay: 16ms
            - component.update: trmnl_display
            - delay: $deep_sleep_delay
            - if:
                condition:
                  lambda: 'return !id(ota_mod);' # Не засыпать, если OTA активен
                then:
                  - deep_sleep.enter:
                      sleep_duration: !lambda 'return id(sleep_time) * 1000;'

          else:
            - logger.log: "Экран уже отображает эту страницу, перерисовка пропущена."

spi:
  clk_pin: $clk_pin
  mosi_pin: $mosi_pin

display:
  platform: waveshare_epaper
  id: trmnl_display
  cs_pin: $cs_pin
  dc_pin: $dc_pin
  busy_pin: 
    number: $busy_pin
    inverted: true # Для предотвращения необратимого повреждения дисплея необходимо инвертировать контакт BUSY на моделях gdew0154m09, Waveshare 7.30in-f и Waveshare 7.50in V2 (и наверно на V3 и других новых моделях). Установите для контакта busy значение inverted: true в настройках
  reset_pin: $reset_pin
  reset_duration: $reset_duration
  model: $model
  update_interval: never
  pages:
    - id: trmnl_page
      lambda: |-
        it.image(0, 0, id(trmnl_image), COLOR_OFF, COLOR_ON);

    - id: failed
      lambda: |-
        // Выводим текст ровно по центру дисплея по обеим осям
        it.printf(it.get_width() / 2, it.get_height() / 2, id(pixel_font), COLOR_ON, TextAlign::CENTER, "Error");

    - id: pause_page
      lambda: |-
        // it.image(it.get_width() / 2, it.get_height() / 3, id(pause_image), ImageAlign::CENTER, COLOR_OFF, COLOR_ON);
        it.fill(COLOR_OFF);
    - id: ota_page
      lambda: |-
        it.fill(COLOR_OFF);
        it.printf(it.get_width() / 2, it.get_height() / 2, id(pixel_font), COLOR_ON, TextAlign::CENTER, "OTA MODE");

font:
  - file: "https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf"
    id: pixel_font
    size: 64 
    glyphs: "EroOTAMD "

# image:
#   - file: "https://raw.githubusercontent.com/kfattum/esphome-trmnl/refs/heads/main/img/smail-dithered.png"
#     id: pause_image
#     type: BINARY

button:
  - platform: factory_reset
    name: "Сброс"
    id: factory_reset_button

  - platform: restart
    name: "Перезагрузка"
    id: restart_button


binary_sensor:

  - platform: gpio
    name: Button
    id: back_button
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      allow_other_uses: true  
      inverted: true
    internal: True
    on_multi_click:
      - timing:
          - ON for at least 3s
          - OFF for at least 0.5s
        then:
          - button.press: factory_reset_button

      - timing:
          - ON for at least 0.3s
          - OFF for at least 0.5s
        then:
          - button.press: restart_button

sensor:
  - platform: adc
    name: "Напряжение батареи"
    icon: "mdi:alpha-v-cirde"
    entity_category: "diagnostic"
    id: battery_voltage
    pin: $adc_pin
    attenuation: 12db
    samples: 128
    # sampling_mode: min
    filters:
      - multiply: 2
      - round: 2
      - calibrate_linear:
           - 3.22 -> 3.75
           - 3.64 -> 4.19
           - 3.89 -> 4.20
    on_value:
      - text_sensor.template.publish:
          id: battery_voltage_text
          state: !lambda 'return str_sprintf("%.2f", x).c_str();'

  - platform: copy
    id: battery_voltage_prc
    name: "Уровень заряда батареи"
    source_id: battery_voltage
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    filters:
      - calibrate_linear:
          - 4.20 -> 100
          - 4.19 -> 99
          - 3.75 -> 80
          - 3.50 -> 20
          - 3.00 -> 0
      - round: 0
      - clamp:
          min_value: 0
          max_value: 100
    accuracy_decimals: 0

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "Сигнал Wi-Fi, dB"
    id: wifi_signal_db
    update_interval: never
    entity_category: "diagnostic"
    disabled_by_default: true
    on_value:
      - text_sensor.template.publish:
          id: rssi_text
          state: !lambda 'return str_sprintf("%.0f", x).c_str();'

  - platform: copy # Reports the WiFi signal strength in %
    id: wifi_signal_db_prc
    source_id: wifi_signal_db
    name: "Сигнал Wi-Fi"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    
text_sensor:
  - platform: wifi_info
    mac_address:
      id: mac_address_sensor
  - platform: template
    id: battery_voltage_text
    update_interval: never
  - platform: template
    id: rssi_text
    update_interval: never
  - platform: mqtt_subscribe
    id: screen_design_id_override
    topic: ${name}/config/screen_design_id_override

switch:
  - platform: template
    name: "Блокировка обновления дисплея"
    id: block_update_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:monitor-off"
    entity_category: config