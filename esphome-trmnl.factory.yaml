# 1. Длинное нажатие (более 5 секунд) в режиме глубокого сна сбрасывает принудительно установленый экран, интервал обновления и блокировку обновления дисплея в интеграции Home Assistant
# 2. Короткое нажатие пробуждает/перезагружает устройство
# 3. Длинное нажатие (более 5 секунд) в активном режиме включает режим настройки в котором если плата подключена к wifi то отобразится qr-код со ссылкой на web-интерфейс, а если не подключена то qr-код со ссылкой на captive portal. В этом режиме устройство не засыпает 30 минут, а затем переходит в глубокий сон. 

substitutions:
  fw_version: "2.0.5 esphome-trmnl-factory"
  HA_url: "http://homeassistant.local:8123" # URL сервера Home Assistant
  Inker_url: "http://homeassistant.local:8124" # URL сервера Inker

  wifi_ap_password: "esphome-trmnl"
  web_username: "esphome-trmnl"
  web_password: "esphome-trmnl"

  # manual_ip_static_ip: "192.168.1.222" # Статический IP-адрес дисплея
  # manual_ip_gateway: "192.168.1.1" # Шлюз локальной сети
  # manual_ip_subnet: "255.255.255.0" # Подсеть локальной сети

  name: "trmnl" # Это имя дисплея. Может содержать только строчные буквы, цифры и дефисы и по умолчанию может иметь длину не более 24
  friendly_name: "TRMNL" # Это имя отображается в интерфейсе Home Assistant
  model: 7.50in-bV3 # Модель дисплея
  wifi_output_power: 8.5dB # Величина мощности передачи для интерфейса Wi-Fi от 8,5 dB до 20,5 dB

  img_type: BINARY # Указывает способ внутреннего кодирования изображения.
  img_format: PNG # формат, в котором закодировано изображение.
  img_url_setup_logo: http://raw.githubusercontent.com/kfattum/esphome-trmnl/refs/heads/main/img/setup-logo.bmp

  deep_sleep_delay: 1000ms # Задержка перед сном для обновления экрана 
  sleep_time: "3600" # (сек.) Время сна экрана по умолчанию 
  error_sleep_duration: "1200" # (сек.) Время сна экрана при возникновении ошибки
  reset_duration: 200ms # Длительность операции сброса дисплея
  wifi_connect_delay: 15s # Время на попытку подключения к wifi

  # status_led: GPIO2
  button: GPIO32
  adc_pin: GPIO34
  deep_sleep_pin: GPIO32

  clk_pin: GPIO13
  mosi_pin: GPIO14

  cs_pin: GPIO15
  dc_pin: GPIO27
  busy_pin: GPIO25 #Для предотвращения необратимого повреждения дисплея необходимо инвертировать контакт BUSY на моделях gdew0154m09, Waveshare 7.30in-f и Waveshare 7.50in V2 (и наверно на V3 и других новых моделях). Установите для контакта busy значение inverted: true в настройках
  reset_pin: GPIO26   

globals:
  - id: device_id
    type: std::string
    max_restore_data_length: 13
    restore_value: true
    initial_value: '""'
  - id: api_key
    type: std::string
    max_restore_data_length: 43
    restore_value: true
    initial_value: '""'
  - id: sleep_time
    type: uint32_t
    initial_value: "$sleep_time"
  - id: current_page_id
    type: uint8_t
    restore_value: true
    initial_value: "0" # 0: нет данных, 1: trmnl_page, 2: failed, 3: pause_page 4: ota_page 5: ap_page
  - id: ota_mod
    type: bool
    initial_value: "false"
  # флаг для очистки screen_design_id_override
  - id: clear_override_flag
    type: bool
    initial_value: "false"
  - id: inker_url_dynamic
    type: std::string
    max_restore_data_length: 64
    restore_value: true
    initial_value: '"$Inker_url"'
  - id: ha_url_dynamic
    type: std::string
    max_restore_data_length: 64
    restore_value: true
    initial_value: '"$HA_url"'

  - id: override_screen_id
    type: std::string
    max_restore_data_length: 128
    initial_value: '""'
  - id: override_block_update
    type: std::string
    max_restore_data_length: 3
    initial_value: '""'
  - id: override_sleep_time
    type: std::string
    max_restore_data_length: 7
    initial_value: '""'

esp32:
  variant: ESP32
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: 3.1
      sram1_as_iram: true
  cpu_frequency: 160MHz
  watchdog_timeout: 10 s
esphome:
  min_version: 2026.1.3 
  name: $name
  friendly_name: $friendly_name
  name_add_mac_suffix: true
  on_boot:
    priority: -10
    then:
      - delay: 100ms 
      - if:
          condition:
            lambda: 'return id(back_button).state;' 
          then:
            - logger.log: "Кнопка зажата при старте! Взведен флаг очистки Screen Design ID Override."
            - lambda: 'id(clear_override_flag) = true;'
            
# Проверка наличия сохраненных данных Wi-Fi
      - if:
          condition:
            lambda: 'return !wifi::global_wifi_component->has_sta();'
          then:
            - logger.log: "No saved Wi-Fi credentials! Entering AP setup mode."
            - lambda: 'id(ota_mod) = true;'
            - wait_until:
                condition: wifi.ap_active
                timeout: 15s
            - script.execute: generate_qr_link_ap
            - delay: 16ms
            - script.execute:
                id: safe_update_display
                target_page: 5 # Переход на ap_page, так как нет подключения к сети
                force_update: true

      # Продолжаем обычный запуск, если режим OTA не активен
      - if:
          condition:
            lambda: 'return !id(ota_mod);'
          then:
            - delay: $wifi_connect_delay
            - if:
                condition:
                  not:
                    wifi.connected:
                then:
                  - script.execute: trmnl_error

  project:
    name: "kfattum.esphome-trmnl"
    version: "$fw_version"

logger:
  on_message:
    - level: ERROR
      then:
        - if:
            condition:
              lambda: 'return !id(ota_mod);'
            then:
              - delay: 30s
              - script.execute: trmnl_error
            else:
              - logger.log: "Ошибка произошла в OTA режиме, сон отменен."

ota:
  - platform: esphome
  - platform: web_server

web_server:
  port: 80
  version: 2 
  auth:
    username: $web_username 
    password: $web_password 
    
captive_portal:
  
improv_serial:

wifi:
  min_auth_mode: WPA2
  power_save_mode: LIGHT
  fast_connect: true 
  output_power: $wifi_output_power
  ap:
    ap_timeout: 15s
    password: $wifi_ap_password
  on_connect:
    then:
      - if:
          condition:
            lambda: 'return !id(ota_mod);'
          then:
            - script.execute: trmnl_config 
          else:
            - logger.log: "Wi-Fi подключен, активен OTA MODE"
            - delay: 16ms
            - script.execute: generate_qr_link_web_server
            - delay: 16ms
            - script.execute:
                id: safe_update_display
                target_page: 4 
                force_update: true

http_request:
  buffer_size_tx: 1024
  verify_ssl: False
  timeout: 2s
  watchdog_timeout: 3s

deep_sleep:
  wakeup_pin:
    number: $deep_sleep_pin
    allow_other_uses: true  
    inverted: true 
  run_duration: 30 min
  sleep_duration: $error_sleep_duration s

qr_code:
  - id: qr_web_server
    value: "placeholder"
  - id: qr_ap
    value: "placeholder"

online_image:
  - id: trmnl_image
    format: $img_format
    type: $img_type
    buffer_size: 7000
    url: $img_url_setup_logo
    # resize: 800x480
    on_download_finished:
      - delay: 16ms
      - wifi.disable:
      - delay: 250ms
      - script.execute:
          id: safe_update_display
          target_page: 1
          force_update: true 
    on_error:
        - delay: 16ms
        - script.execute: trmnl_error

script:
  # 1. Скрипт получения конфигурации по HTTP
  - id: trmnl_config
    then:
      # Проверяем флаг сброса
      - if:
          condition:
            lambda: 'return id(clear_override_flag);'
          then:
            - logger.log: "Выполняется сброс Screen Design ID Override на сервере..."
            - http_request.post:
                url: !lambda 'return (id(ha_url_dynamic) + "/api/config/clear").c_str();'
                request_headers:
                  ID: !lambda 'return id(mac_address_sensor).state.c_str();'
            - delay: 100 ms
      - logger.log: "Запрос конфигурации HTTP..."
      - http_request.get:
          url: !lambda 'return (id(ha_url_dynamic) + "/api/config/").c_str();'
          request_headers:
            ID: !lambda 'return id(mac_address_sensor).state.c_str();'
            Battery-Voltage: !lambda 'return id(battery_voltage_text).state.c_str();'
            Battery-Voltage-prc: !lambda 'return id(battery_voltage_prc_text).state.c_str();'
            Wi-Fi-Signal-dB-prc: !lambda 'return id(wifi_signal_db_prc_text).state.c_str();'
          capture_response: true 
          on_response:
            - if:
                condition:
                  lambda: return response->status_code >= 200 && response->status_code < 300;
                then:
                  - logger.log:
                      format: "HTTP Config Response: %s"
                      args: [body.c_str()]
                  - lambda: |-
                      json::parse_json(body, [](JsonObject root) -> bool {
                        if (root.containsKey("screen_design_id_override")) {
                          id(override_screen_id) = root["screen_design_id_override"].as<std::string>();
                        }

                        if (root.containsKey("block_update")) {
                          id(override_block_update) = root["block_update"].as<std::string>();
                        }
                        if (root.containsKey("sleep_time")) {
                          id(override_sleep_time) = root["sleep_time"].as<std::string>();
                        }

                        return true;
                      });

                else:
                  - logger.log:
                      format: "HTTP Config Failed. HTTP Status: %d"
                      args: [response->status_code]
            - script.execute: trmnl_router
          on_error:
            - logger.log: "Ошибка HTTP при получении конфига. "
            - script.execute: trmnl_router

  # Роутер: направляет либо в Setup, либо в Update
  - id: trmnl_router
    then:
      - if:
          condition:
            lambda: |-
              return id(device_id).empty() || id(api_key).empty();
          then:
            - script.execute: trmnl_setup
          else:
            - script.execute: trmnl_update

  - id: trmnl_setup
    then:
      - logger.log: "Setting up TRMNL"
      - http_request.get:
          url: !lambda 'return (id(inker_url_dynamic) + "/api/setup/").c_str();'
          request_headers:
            ID: !lambda 'return id(mac_address_sensor).state.c_str();'
          capture_response: true
          on_response:
            - if:
                condition:
                  lambda: return response->status_code >= 200 && response->status_code < 300;
                then:
                  - logger.log:
                      format: "TRMNL Setup Response: %s"
                      args: [body.c_str()]
                  - lambda: |-
                      json::parse_json(body, [](JsonObject root) -> bool {
                        id(api_key) = root["api_key"].as<std::string>();
                        id(device_id) = root["friendly_id"].as<std::string>();
                        global_preferences->sync();
                        return true;
                      });
                  - delay: 16ms
                  - script.execute: trmnl_update
                else:
                  - logger.log:
                      format: "TRMNL Setup Failed. HTTP Status: %d"
                      args: [response->status_code]
                  - script.execute: trmnl_error
          on_error:
            - logger.log: "TRMNL Setup Connection Error / Timeout"
            - script.execute: trmnl_error

  - id: trmnl_update
    then:
      - if:
          condition:
            lambda: 'return id(override_block_update) == "true";'
          then:
            - logger.log: "Обновление дисплея заблокировано сервером"
            - lambda: |-
                // Чтение и проверка override_sleep_time при блокировке
                std::string http_sleep_str = id(override_sleep_time);
                if (!http_sleep_str.empty()) {
                  uint32_t new_sleep = strtoul(http_sleep_str.c_str(), nullptr, 10);
                  if (new_sleep > 59 && id(sleep_time) != new_sleep) {
                    id(sleep_time) = new_sleep;
                    ESP_LOGD("update", "Обновлен sleep_time из override_sleep_time: %u", id(sleep_time));
                  }
                }
            - delay: 16ms
            - script.execute:
                id: safe_update_display
                target_page: 3 # ID страницы pause_page
                force_update: false
            - delay: $deep_sleep_delay
            - deep_sleep.enter:
                sleep_duration: !lambda 'return id(sleep_time) * 1000;'
          else:
            - logger.log: "Updating TRMNL image"
            - http_request.get:
                url: !lambda 'return (id(inker_url_dynamic) + "/api/display/").c_str();'
                request_headers:
                  ID: !lambda 'return id(mac_address_sensor).state.c_str();'
                  Access-Token: !lambda 'return id(api_key).c_str();'
                  Battery-Voltage: !lambda 'return id(battery_voltage_text).state.c_str();'
                  Refresh-Rate: !lambda 'return std::to_string(id(sleep_time)).c_str();'
                  FW-Version: !lambda 'return "$fw_version";'
                  RSSI: !lambda 'return id(rssi_text).state.c_str();'
                capture_response: true
                on_response:
                  - delay: 16ms
                  - if:
                      condition:
                        lambda: return response->status_code >= 200 && response->status_code < 300;
                      then:
                        - logger.log:
                            format: "TRMNL Update Response: %s"
                            args: [body.c_str()]
                        - delay: 16ms
                        - lambda: |-
                            json::parse_json(body, [](JsonObject root) -> bool {
                              if (root["status"].is<int>() && root["status"].as<int>() == 0) {
                                std::string override_str = id(override_screen_id);
                                
                                // Если строка не пустая и содержит прямую ссылку
                                if (!override_str.empty() && override_str.find("http") == 0) {
                                  id(trmnl_image).set_url(override_str);
                                  ESP_LOGD("update", "Используется прямая ссылка на изображение (Override)");
                                } else {
                                  id(trmnl_image).set_url(root["image_url"].as<std::string>());
                                }
                                
                                // Логика определения sleep_time
                                std::string http_sleep_str = id(override_sleep_time);
                                
                                // Проверяем, есть ли что-то в конфиге HTTP
                                if (!http_sleep_str.empty()) {
                                  uint32_t http_sleep = strtoul(http_sleep_str.c_str(), nullptr, 10);
                                  
                                  if (http_sleep > 59) {
                                    id(sleep_time) = http_sleep;
                                    ESP_LOGD("update", "Используется sleep_time из HA (HTTP Config): %u", id(sleep_time));
                                  } else {
                                    id(sleep_time) = root["refresh_rate"].as<uint32_t>();
                                    ESP_LOGW("update", "HTTP Config sleep_time некорректен, используем данные inker: %u", id(sleep_time));
                                  }
                                } else {
                                  id(sleep_time) = root["refresh_rate"].as<uint32_t>();
                                  ESP_LOGD("update", "HTTP Config пустое, используется sleep_time от inker: %u", id(sleep_time));
                                }
                              }
                              return true;
                            });
                        - delay: 16ms
                        - component.update: trmnl_image
                      else:
                        - logger.log:
                            format: "TRMNL Update Failed. HTTP Status: %d"
                            args: [response->status_code]
                        - script.execute: trmnl_error
                on_error:
                  - logger.log: "TRMNL Update Connection Error / Timeout"
                  - script.execute: trmnl_error

  - id: trmnl_error
    then:
      - if:
          condition:
            lambda: 'return !id(ota_mod);'
          then:
            - script.execute:
                id: safe_update_display
                target_page: 2
                force_update: false
            - delay: $deep_sleep_delay
            - deep_sleep.enter:
                sleep_duration: $error_sleep_duration s
          else:
            - logger.log: "Ошибка произошла в OTA режиме, сон отменен."

  - id: safe_update_display
    parameters:
      target_page: uint8_t
      force_update: bool
    then:
      - if:
          condition:
            or:
              - lambda: 'return id(current_page_id) != target_page;'
              - lambda: 'return force_update;'
          then:
            - delay: 16ms
            - lambda: |-
                id(current_page_id) = target_page; // Запоминаем/подтверждаем новую страницу
                if (target_page == 1) {
                  id(trmnl_display).show_page(id(trmnl_page));
                  ESP_LOGD("display", "Обновление экрана: trmnl_page");
                } else if (target_page == 2) {
                  id(trmnl_display).show_page(id(failed));
                  ESP_LOGD("display", "Обновление экрана: failed");
                } else if (target_page == 3) {
                  id(trmnl_display).show_page(id(pause_page));
                  ESP_LOGD("display", "Обновление экрана: pause_page");
                } else if (target_page == 4) { 
                  id(trmnl_display).show_page(id(ota_page)); 
                  ESP_LOGD("display", "Обновление экрана: ota_page");
                } else if (target_page == 5) { 
                  id(trmnl_display).show_page(id(ap_page)); 
                  ESP_LOGD("display", "Обновление экрана: ap_page");
                }
            - delay: 16ms
            - component.update: trmnl_display
            - delay: $deep_sleep_delay
            - if:
                condition:
                  lambda: 'return !id(ota_mod);' # Не засыпать, если OTA активен
                then:
                  - deep_sleep.enter:
                      sleep_duration: !lambda 'return id(sleep_time) * 1000;'

          else:
            - logger.log: "Экран уже отображает эту страницу, перерисовка пропущена."

  - id: generate_qr_link_web_server
    mode: restart
    then:
      - lambda: |-
          std::string domain = App.get_name() + ".local";
          std::string auth_url = "http://" + domain;
          id(qr_web_server).set_value(auth_url);
          ESP_LOGI("custom", "QR-код с сылкой на веб-сервер успешно создан: %s", auth_url.c_str());

  - id: generate_qr_link_ap
    mode: restart
    then:
      - lambda: |-
          // Получаем текущее имя устройства (с учетом mac-суффикса, например, trmnl-a1b2c3)
          std::string ssid = App.get_name();
          
          // Формируем строку QR-кода для Wi-Fi. 
          std::string wifi_qr = "WIFI:S:" + ssid + ";T:WPA;P:$wifi_ap_password;;";
          
          // Записываем полученную строку в QR-код дисплея
          id(qr_ap).set_value(wifi_qr);
          
          ESP_LOGI("custom", "QR-код для точки доступа успешно обновлен: %s", wifi_qr.c_str());


spi:
  clk_pin: $clk_pin
  mosi_pin: $mosi_pin

display:
  platform: waveshare_epaper
  id: trmnl_display
  cs_pin: $cs_pin
  dc_pin: $dc_pin
  busy_pin: 
    number: $busy_pin
    inverted: true # Для предотвращения необратимого повреждения дисплея необходимо инвертировать контакт BUSY на моделях gdew0154m09, Waveshare 7.30in-f и Waveshare 7.50in V2 (и наверно на V3 и других новых моделях). Установите для контакта busy значение inverted: true в настройках
  reset_pin: $reset_pin
  reset_duration: $reset_duration
  model: $model
  update_interval: never
  pages:
    - id: trmnl_page
      lambda: |-
        it.image(0, 0, id(trmnl_image), COLOR_OFF, COLOR_ON);

    - id: failed
      lambda: |-
        // Выводим текст ровно по центру дисплея по обеим осям
        if (id(sys_language).state == "EN") {
          it.printf(it.get_width() / 2, it.get_height() / 2, id(pixel_font), COLOR_ON, TextAlign::CENTER, "ERROR");
        } else {
          it.printf(it.get_width() / 2, it.get_height() / 2, id(pixel_font), COLOR_ON, TextAlign::CENTER, "ОШИБКА");
        }

    - id: pause_page
      lambda: |-
        // it.image(it.get_width() / 2, it.get_height() / 3, id(pause_image), ImageAlign::CENTER, COLOR_OFF, COLOR_ON);
        it.fill(COLOR_OFF);
        
    - id: ota_page
      lambda: |-
        int center_x = it.get_width() / 2; // Центр по X
        int center_y = it.get_height() / 2; // середина по Y

        auto qr_pixels = id(qr_web_server).get_size() * 5; // Размер QR-кода
        auto qr_x = center_x - (qr_pixels / 2); // QR-код по центру X
        auto qr_y = center_y + 60; // ТЕКСТ 1 + 60

        auto text_20_y = qr_y + qr_pixels + 20; // ТЕКСТ 2 + Y QR-код + 20

        it.qr_code(qr_x, qr_y, id(qr_web_server), COLOR_ON, 5);

        if (id(sys_language).state == "EN") {
          it.printf(center_x, center_y, id(pixel_font), COLOR_ON, TextAlign::CENTER, "SETUP MODE");
          it.printf(center_x, text_20_y, id(pixel_font_20), COLOR_ON, TextAlign::CENTER, "Web server");
        } else {
          it.printf(center_x, center_y, id(pixel_font), COLOR_ON, TextAlign::CENTER, "РЕЖИМ НАСТРОЙКИ");
          it.printf(center_x, text_20_y, id(pixel_font_20), COLOR_ON, TextAlign::CENTER, "Web сервер");
        }
    - id: ap_page
      lambda: |-
        int center_x = it.get_width() / 2; // Центр по X
        int center_y = it.get_height() / 2; // середина по Y

        auto qr_pixels = id(qr_ap).get_size() * 5; // Размер QR-кода
        auto qr_x = center_x - (qr_pixels / 2); // QR-код по центру X
        auto qr_y = center_y + 60; // ТЕКСТ 1 + 60

        auto text_20_y = qr_y + qr_pixels + 20; // ТЕКСТ 2 + Y QR-код + 20

        it.qr_code(qr_x, qr_y, id(qr_ap), COLOR_ON, 5);

        if (id(sys_language).state == "EN") {
          it.printf(center_x, center_y, id(pixel_font), COLOR_ON, TextAlign::CENTER, "SETUP MODE");
          it.printf(center_x, text_20_y, id(pixel_font_20), COLOR_ON, TextAlign::CENTER, "Scan QR code to connect to Wi-Fi");
        } else {
          it.printf(center_x, center_y, id(pixel_font), COLOR_ON, TextAlign::CENTER, "РЕЖИМ НАСТРОЙКИ");
          it.printf(center_x, text_20_y, id(pixel_font_20), COLOR_ON, TextAlign::CENTER, "Отсканируйте QR код и подключите к своей wifi сети");
        }

font:
  - file: "https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf"
    id: pixel_font
    size: 64 
    glyphs: "EROОШИБКАTUP MDРЕЖМНСТЙS"

  - file: "https://github.com/IdreesInc/Monocraft/releases/download/v3.0/Monocraft.ttf"
    id: pixel_font_20
    size: 20 
    glyphs: "Web srvсервScanQRodti-FОтканиуйодплючwf"

# image:
#   - file: "https://raw.githubusercontent.com/kfattum/esphome-trmnl/refs/heads/main/img/smail-dithered.png"
#     id: pause_image
#     type: BINARY

button:
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button

  - platform: restart
    name: "Restart"
    id: restart_button

binary_sensor:
  - platform: gpio
    name: Button
    id: back_button
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      allow_other_uses: true  
      inverted: true
    internal: True
    filters:
      - delayed_on_off: 20ms
    on_multi_click:
      # 1. Удержание кнопки более 2 секунд — Запуск OTA-режима
      - timing:
          - ON for at least 2s
        then:
          - logger.log: "Удержание кнопки! Вход в режим OTA."
          - lambda: 'id(ota_mod) = true;'
          - wait_until:
              condition: wifi.ap_active
              timeout: 20s
          - if:
              condition: wifi.ap_active
              then:
                - logger.log: "WiFi AP включена"
                - script.execute: generate_qr_link_ap
                - delay: 16ms
                - script.execute:
                    id: safe_update_display
                    target_page: 5 
                    force_update: true

      # 2. Короткое нажатие — Перезагрузка
      - timing:
          - ON for at most 1s
          - OFF for at least 0.5s
        then:
          - button.press: restart_button

sensor:
  - platform: adc
    name: "Battery Voltage"
    icon: "mdi:alpha-v-circle"
    entity_category: "diagnostic"
    id: battery_voltage
    pin: $adc_pin
    attenuation: 12db
    samples: 128
    filters:
      - multiply: 2
      - round: 2
      - calibrate_linear:
           - 3.22 -> 3.75
           - 3.64 -> 4.19
           - 3.89 -> 4.20
    on_value:
      - text_sensor.template.publish:
          id: battery_voltage_text
          state: !lambda 'return str_sprintf("%.2f", x).c_str();'

  - platform: copy
    id: battery_voltage_prc
    name: "Battery Level"
    source_id: battery_voltage
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    filters:
      - calibrate_linear:
          - 4.20 -> 100
          - 4.19 -> 99
          - 3.75 -> 80
          - 3.60 -> 0
      - round: 0
      - clamp:
          min_value: 0
          max_value: 100
    accuracy_decimals: 0
    on_value:
      - text_sensor.template.publish:
          id: battery_voltage_prc_text
          state: !lambda 'return str_sprintf("%.2f", x).c_str();'

  - platform: wifi_signal
    name: "Wi-Fi Signal, dB"
    id: wifi_signal_db
    update_interval: never
    entity_category: "diagnostic"
    disabled_by_default: true
    on_value:
      - text_sensor.template.publish:
          id: rssi_text
          state: !lambda 'return str_sprintf("%.0f", x).c_str();'

  - platform: copy # Reports the WiFi signal strength in %
    id: wifi_signal_db_prc
    source_id: wifi_signal_db
    name: "Wi-Fi Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    on_value:
      - text_sensor.template.publish:
          id: wifi_signal_db_prc_text
          state: !lambda 'return str_sprintf("%.2f", x).c_str();'

text_sensor:
  - platform: wifi_info
    mac_address:
      id: mac_address_sensor

  - platform: template
    id: battery_voltage_text
    update_interval: never

  - platform: template
    id: rssi_text
    update_interval: never

  - platform: template
    id: battery_voltage_prc_text
    update_interval: never

  - platform: template
    id: wifi_signal_db_prc_text
    update_interval: never

text:
  - platform: template
    name: "Inker Server URL"
    mode: text
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return x != "" && x != id(inker_url_dynamic);'
          then:
            - delay: 16ms
            - lambda: |-
                id(inker_url_dynamic) = x;
                global_preferences->sync(); // Сохраняем во flash-память ESP32
            - logger.log:
                format: "URL сервера Inker принудительно изменен на: %s"
                args: [ 'id(inker_url_dynamic).c_str()' ]

  - platform: template
    name: "Home Assistant Server URL"
    mode: text
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return x != "" && x != id(ha_url_dynamic);'
          then:
            - delay: 16ms
            - lambda: |-
                id(ha_url_dynamic) = x;
                global_preferences->sync(); // Сохраняем во flash-память ESP32
            - logger.log:
                format: "URL сервера Inker принудительно изменен на: %s"
                args: [ 'id(ha_url_dynamic).c_str()' ]

select:
  - platform: template
    name: "Language"
    id: sys_language
    entity_category: config
    optimistic: true
    options:
      - "RU"
      - "EN"
    initial_option: "EN"
    restore_value: true