substitutions:
  server_ip: http://192.168.1.123:80 #http://192.168.1.119:4567
  name: "trmnl-2025-12-7"
  friendly_name: TRMNL
  status_led: GPIO2
  button: GPIO32
  adc_pin: GPIO34
  deep_sleep_pin: GPIO32
  deep_sleep_delay: 1000ms #Задержка перед сном для обновления экрана 
  # img
  img_type: BINARY
  img_format: PNG
  img_url_setup_logo: http://raw.githubusercontent.com/kfattum/esphome-trmnl/refs/heads/main/img/setup-logo.bmp
  # eink_display
  cs_pin: GPIO15
  dc_pin: GPIO27
  busy_pin: GPIO25
  reset_pin: GPIO26   
  reset_duration: 2 ms
  model: 7.50in-bV3       #✅7.50in-bV2 ✅7.50in-bV3 ❌7.50in-bV3-bwr(много ест оперативки)
  # spi
  clk_pin: GPIO13
  mosi_pin: GPIO14

globals:
  - id: device_id
    type: std::string
    max_restore_data_length: 6
    restore_value: true
    initial_value: '""' # bold-eagle-15
  - id: api_key
    type: std::string
    max_restore_data_length: 43
    restore_value: true
    initial_value: '""' # MnVGqCNfGhUPaDzJQMo24EFpSn12VaJh4DBRzztOpIw
  - id: sleep_time
    type: uint32_t
    restore_value: true
    initial_value: "3600"

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

esphome:
  min_version: 2026.1.3 #https://github.com/esphome/esphome/pull/13599
  name: $name
  friendly_name: $friendly_name
  platformio_options:
    board_build.f_flash: 80000000L
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  # name_add_mac_suffix: true
  # Dynamically set QR Code value for connecting to captive portal
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            id(wifi_connect_qr).set_value("WIFI:T:nopass;S:" + App.get_name() + ";;");
  # This will allow for project identification,
  # configuration and updates.
  project:
    name: jesserockz.trmnl
    version: dev # This will be replaced by the github workflows with the `release` version

# This should point to the public location of the yaml file that will be adopted.
# In this case it is the core yaml file that does not contain the extra things
# that are provided by this factory yaml file as the user does not need these once adopted.
dashboard_import:
  package_import_url: github://jesserockz/esphome-trmnl/trmnl.yaml@main

# Sets up Bluetooth LE (Only on ESP32) to allow the user
# to provision wifi credentials to the device.
# esp32_improv:
#   authorizer: none

# To be able to get logs from the device via serial and api.
logger:
  on_message:
    level: ERROR
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "⚠️ Ошибка ESPHome: $name"
                  notification_id: "esphome_error" # Раскомментируйте, если хотите перезаписывать одно уведомление, а не плодить новые
                data_template:
                  message: "Компонент: {{ tag }}\nДетали ошибки: {{ message }}"
                variables:
                  message: return message;
                  tag: return tag;

# API is a requirement of the dashboard import.
api:
  encryption:
    key: !secret enc_key

# OTA is required for Over-the-Air updating
ota:
  - platform: esphome
    password: !secret ota_password

# Sets up the improv via serial client for Wi-Fi provisioning.
# Handy if your device has a usb port for the user to add credentials when they first get it.
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: LIGHT
  fast_connect: true
  # output_power: 8.5dB
  manual_ip:
    static_ip: 192.168.1.222
    gateway: 192.168.1.1
    subnet: 255.255.255.0
  on_connect:
    - delay: 16ms
    - component.update: battery_level
    - component.update: wifi_signal_db
    - if:
        condition:
          lambda: |-
            return id(device_id).empty() || id(api_key).empty();
        then:
          - script.execute: trmnl_setup
        else:
          - script.execute: trmnl_update
  # Включите резервную точку доступа (captive portal) на случай сбоя Wi-Fi-соединения
  ap:
    ssid: $name
    password: !secret hotspot_password

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

http_request:
  buffer_size_tx: 2048
  verify_ssl: False
  timeout: 15s
  watchdog_timeout: 20s

deep_sleep:
  wakeup_pin:
    number: $deep_sleep_pin
    allow_other_uses: true  
    inverted: true 
  run_duration: 2 min
  sleep_duration: 15 min

font:
  - id: roboto_16
    file: gfonts://Roboto
    size: 16
  - id: roboto_32
    file: gfonts://Roboto
    size: 32
        
image:
  - id: trmnl_logo
    file: "images/logo--black.svg"
    type: BINARY

qr_code:
  - id: wifi_connect_qr
    value: "WIFI:T:nopass;S:TRMNL;;"
  - id: wifi_failed_qr
    value: "https://help.usetrmnl.com/en/articles/10193157-device-wifi-troubleshooting"

online_image:
  - id: trmnl_image
    format: $img_format
    type: $img_type
    buffer_size: 20000
    url: $img_url_setup_logo
    resize: 800x480
    on_download_finished:
      - display.page.show: trmnl_page
      - component.update: trmnl_display
      - delay: $deep_sleep_delay
      - deep_sleep.enter:
          sleep_duration: 3600 s #!lambda 'return id(sleep_time) * 1000;'

script:

# /api/setup
# {
#     "api_key": "...",
#     "friendly_id": "...",
#     "image_url": "https://usetrmnl.com/images/setup/setup-logo.bmp",
#     "message": "Register at usetrmnl.com/signup with Device ID '...'",
#     "status": 200
# }
  - id: trmnl_setup
    then:
      - logger.log: "Setting up TRMNL"
      - http_request.get:
          url: ${server_ip}/api/setup/
          request_headers:
            ID: !lambda 'return id(mac_address_sensor).state.c_str();'
          capture_response: true
          on_response:
            - logger.log:
                format: "TRMNL Setup Response: %s"
                args: [body.c_str()]
            - if:
                condition:
                  lambda: return response->status_code == 200;
                then:
                  - lambda: |-
                      json::parse_json(body, [](JsonObject root) -> bool {
                        id(api_key) = root["api_key"].as<std::string>();
                        id(device_id) = root["friendly_id"].as<std::string>();
                        global_preferences->sync();
                        return true;
                      });
                  - delay: 16ms  # lets the http_request component free up the reserved memory
                  - script.execute: trmnl_update
          on_error:
              - script.execute: trmnl_error
              - deep_sleep.enter:
                  sleep_duration: 600 s

# curl http://192.168.1.123:80/api/display --header "access-token:xxxxxxxxxxxxxxxxxxxxxx"
# Invoke-WebRequest -Uri "http://192.168.1.123:80/api/display" -Headers @{"access-token"="MnVGqCNfGhUPaDzJQMo24EFpSn12VaJh4DBRzztOpIw"}

# /api/display
# {
#     "filename": "....bmp",
#     "firmware_url": "https://trmnl.s3.us-east-2.amazonaws.com/FW1.4.5.bin",
#     "image_url": "https://trmnl.s3.us-east-2.amazonaws.com/...",
#     "refresh_rate": 903,
#     "reset_firmware": false,
#     "special_function": "identify",
#     "status": 0,
#     "update_firmware": null
# }
  - id: trmnl_update
    then:
      - logger.log: "Updating TRMNL image"
      - http_request.get:
          url: ${server_ip}/api/display/
          request_headers:
            ID: !lambda 'return id(mac_address_sensor).state.c_str();'
            Access-Token: !lambda 'return id(api_key).c_str();'
            Battery-Voltage: !lambda 'return id(battery_voltage_text).state.c_str();'
          capture_response: true
          on_response:
            - logger.log:
                format: "TRMNL Update Response: %s"
                args: [body.c_str()]
            - lambda: |-
                json::parse_json(body, [](JsonObject root) -> bool {
                  if (root["status"].as<int>() == 0) {
                    id(trmnl_image).set_url(root["image_url"].as<std::string>());
                    id(sleep_time) = root["refresh_rate"].as<uint32_t>();
                  }
                  return true;
                });
            - delay: 16ms  # lets the http_request component free up the reserved memory
            - component.update: trmnl_image
          on_error:
              - script.execute: trmnl_error
              - deep_sleep.enter:
                  sleep_duration: 600 s

  - id: trmnl_error
    then:
      - if:
          condition:
            api.connected:
          then:
            - homeassistant.service:
                service: persistent_notification.create
                data:
                  title: "⚠️ Ошибка ESPHome: $name"
                  notification_id: "esphome_error" # Раскомментируйте, если хотите перезаписывать одно уведомление, а не плодить новые
                data_template:
                  message: "Компонент: {{ tag }}\nДетали ошибки: {{ message }}"

spi:
  clk_pin: $clk_pin
  mosi_pin: $mosi_pin

display:
  platform: waveshare_epaper
  id: trmnl_display
  cs_pin: $cs_pin
  dc_pin: $dc_pin
  busy_pin: 
    number: $busy_pin
    inverted: true #Для предотвращения необратимого повреждения дисплея необходимо инвертировать контакт BUSY на моделях gdew0154m09, Waveshare 7.30in-f и Waveshare 7.50in V2 (и наверно на V3 и других новых моделях). Установите для контакта busy значение inverted: true в настройках
  reset_pin: $reset_pin
  reset_duration: $reset_duration
  model: $model
  update_interval: never
  pages:
    - id: trmnl_page
      lambda: |-
        it.image(0, 0, id(trmnl_image), COLOR_ON, COLOR_OFF);
    - id: logo
      lambda: |-
        it.image(0, 0, id(trmnl_logo));
    - id: wifi_connect
      lambda: |-
        // Factory firmware draws at X: 640, Y: 337 and dimensions of 130x130
        auto size = id(wifi_connect_qr).get_size() * 2;
        auto x = (it.get_width() / 2) - (size / 2);
        auto y = (it.get_height() / 2) - (size / 2);
        it.qr_code(x, y, id(wifi_connect_qr), COLOR_ON, 2);
    - id: wifi_failed
      lambda: |-
        // Factory firmware draws at X: 640, Y: 337 and dimensions of 130x130
        auto size = id(wifi_failed_qr).get_size() * 2;
        auto x = (it.get_width() / 2) - (size / 2);
        auto y = (it.get_height() / 2) - (size / 2);
        it.qr_code(x, y, id(wifi_failed_qr), COLOR_ON, 2);

    - id: main_page
      lambda: |-
        it.print(100, 100, id(roboto_32), "Hello ESPHome on TRMNL!");
        it.printf(100, 200, id(roboto_32), "Uptime: %d seconds", millis() / 1000);

        it.printf(750, 430, id(roboto_16), TextAlign::BOTTOM_RIGHT, "Battery: %.2fV", id(battery_voltage).state);
    - id: blank_page
      lambda: |-
        it.fill(COLOR_ON);

button:
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_button
  - platform: restart
    name: "Перезагрузка"
    id: restart_button

binary_sensor:

  - platform: gpio
    name: Button
    id: back_button
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      allow_other_uses: true  
      inverted: true
    internal: True
    on_multi_click:
      - timing:
          - ON for at least 3s
          - OFF for at least 0.5s
        then:
          - button.press: factory_reset_button

      - timing:
          - ON for at least 0.3s
          - OFF for at least 0.5s
        then:
          - script.execute: trmnl_update

  - platform: status
    name: "Статус"

sensor:
  - platform: adc
    name: "Напряжение батареи"
    icon: "mdi:alpha-v-cirde"
    id: battery_voltage
    pin: $adc_pin
    attenuation: 12db
    samples: 128
    filters:
      - multiply: 2.21925
    on_value:
      - text_sensor.template.publish:
          id: battery_voltage_text
          state: !lambda 'return str_sprintf("%.2f", x).c_str();'

  - platform: template
    name: "Уровень заряда батареи"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: never
    filters:
      - calibrate_linear:
          - 4.20 -> 100
          - 4.19 -> 99
          - 3.75 -> 80
          - 3.50 -> 20
          - 3.00 -> 0
      - clamp:
          min_value: 0
          max_value: 100

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "Сигнал Wi-Fi, dB"
    id: wifi_signal_db
    update_interval: never
    entity_category: "diagnostic"
    internal: True

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "Сигнал Wi-Fi"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""

text_sensor:
  - platform: wifi_info
    mac_address:
      id: mac_address_sensor
  - platform: template
    id: battery_voltage_text
    update_interval: never